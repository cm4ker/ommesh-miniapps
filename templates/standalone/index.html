<style>
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px calc(16px + var(--safe-right, 0px)) calc(24px + var(--safe-bottom, 0px)) calc(16px + var(--safe-left, 0px));
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  h2 { margin: 0; font-size: 17px; }
  p { margin: 0; font-size: 13px; color: var(--text-muted); }
  textarea {
    width: 100%;
    min-height: 120px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--text);
    font: inherit;
    resize: vertical;
  }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
  button {
    padding: 8px 14px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-contrast);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
</style>
<div class="wrap">
  <div class="card">
    <h2 id="title">Signal Notes</h2>
    <p id="sub">Stored locally per radio via app.storage (zero radio permissions).</p>
    <textarea id="note" placeholder="Write a quick note…"></textarea>
    <div class="row">
      <span id="status">Ready</span>
      <button type="button" id="saveBtn">Save</button>
    </div>
  </div>
</div>
<script>
window.ommeshReady.then(async function (app) {
  var ru = app.context.locale === "ru";
  var noteEl = document.getElementById("note");
  var statusEl = document.getElementById("status");
  if (ru) {
    document.getElementById("title").textContent = "Заметки эфира";
    document.getElementById("sub").textContent = "Хранится локально для текущего радио через app.storage (без доступа к эфиру).";
    noteEl.placeholder = "Напишите заметку…";
    document.getElementById("saveBtn").textContent = "Сохранить";
    statusEl.textContent = "Готово";
  }
  var saved = await app.storage.get("note");
  if (typeof saved === "string") noteEl.value = saved;

  document.getElementById("saveBtn").addEventListener("click", async function () {
    await app.storage.set("note", noteEl.value);
    statusEl.textContent = ru ? "Сохранено ✓" : "Saved ✓";
  });
});
</script>
