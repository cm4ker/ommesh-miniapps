<style>
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px calc(16px + var(--safe-right, 0px)) calc(24px + var(--safe-bottom, 0px)) calc(16px + var(--safe-left, 0px));
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; gap: 8px; align-items: center; }
  button {
    padding: 9px 14px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-contrast); border-color: transparent; }
  button:disabled { opacity: 0.45; cursor: default; }
  .log {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    min-height: 120px;
    max-height: 280px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .muted { color: var(--text-muted); font-size: 12px; }
</style>
<div class="wrap">
  <div class="card">
    <div class="row">
      <button type="button" id="pickBtn">Pick peer</button>
      <button type="button" class="primary" id="pingBtn" disabled>Send PING</button>
    </div>
    <div class="muted" id="status">Select a contact with meshcore-rs v2.</div>
    <div class="log" id="logBox"></div>
  </div>
</div>
<script>
window.ommeshReady.then(async function (app) {
  var ru = app.context.locale === "ru";
  var pickBtn = document.getElementById("pickBtn");
  var pingBtn = document.getElementById("pingBtn");
  var statusEl = document.getElementById("status");
  var logBox = document.getElementById("logBox");
  if (ru) {
    pickBtn.textContent = "Выбрать контакт";
    pingBtn.textContent = "Отправить PING";
    statusEl.textContent = "Выберите собеседника с прошивкой meshcore-rs v2.";
  }

  var peer = app.context.grantedPeers[0] || null;
  var seq = (await app.storage.get("seq")) || 1;
  var log = (await app.storage.get("log")) || [];

  function render() {
    pingBtn.disabled = !peer;
    if (peer) statusEl.textContent = (ru ? "Собеседник: " : "Peer: ") + peer.name + " (" + peer.keyPrefix + ")";
    logBox.innerHTML = log.length
      ? log.map(function (e) { return "<div>" + e.kind + " #" + e.seq + " · " + e.peer + (e.snr != null ? " (" + e.snr + " dB)" : "") + "</div>"; }).join("")
      : '<div class="muted">' + (ru ? "Пакетов пока нет" : "No packets yet") + "</div>";
    logBox.scrollTop = logBox.scrollHeight;
  }

  pickBtn.addEventListener("click", async function () {
    var chosen = await app.peers.pick({ requirePeerData: true });
    if (chosen) { peer = chosen; render(); }
  });

  pingBtn.addEventListener("click", async function () {
    if (!peer) return;
    var n = seq++;
    await app.storage.set("seq", seq);
    var pkt = new Uint8Array([1, n & 0xff, (n >> 8) & 0xff]);
    statusEl.textContent = (ru ? "Отправка PING #" : "Sending PING #") + n + "…";
    try {
      await app.transport.send(peer.keyPrefix, pkt, { retry: true });
    } catch (err) {
      statusEl.textContent = err.message;
    }
  });

  app.transport.onDelivery(function (ev) {
    if (ev.status === "delivered") {
      statusEl.textContent = (ru ? "Доставлено ✓ " : "Delivered ✓ ") + (ev.rttMs ? Math.round(ev.rttMs) + " ms" : "");
    }
  });

  app.transport.onPacket(async function (pkt) {
    var b = pkt.payload;
    if (!b || b.length < 3) return;
    var op = b[0], n = b[1] | (b[2] << 8);
    log.push({ peer: pkt.peerName, kind: op === 1 ? "PING" : "PONG", seq: n, snr: pkt.snr, at: Date.now() });
    if (log.length > 30) log = log.slice(-30);
    await app.storage.set("log", log);
    render();
    if (op === 1 && !pkt.mirrored) {
      await app.transport.send(pkt.peerPrefix, new Uint8Array([2, n & 0xff, (n >> 8) & 0xff]), { retry: true });
    }
  });

  render();
});
</script>
